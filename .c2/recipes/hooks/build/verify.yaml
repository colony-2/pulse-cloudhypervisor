id: cloudhypervisor-verify
input_schema:
  api_version: {type: string, required: true}
  request: {type: string, required: true}
  target_directory: {type: string, required: true}
  candidate: {type: string, required: true}
  base: {type: string, required: true}
  documents: {type: artifact_map, default_value: {}}
  settings: {type: artifact, required: false}
inputs:
  candidate: ${{ inputs.candidate }}
  settings: "${{ has(inputs.settings) ? inputs.settings : null }}"
sequence:
- id: check
  op: command_execution
  const: true
  artifacts:
    build-settings.json: "${{ has(inputs.settings) && inputs.settings != null ? inputs.settings : {'kind':'value','name':'build-settings.json','format':'json','value':null} }}"
  inputs:
    timeout: 90m
    env:
      CLOUDHYPERVISOR_BUILD_SETTINGS: ${{ context.environment.op.inbox }}/build-settings.json
      REPO: ${{ context.environment.op.worktree_path }}
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ inputs.candidate }}
    run: |
      set -eu
      umask 077
      cd "$REPO"
      mkdir -p "$OUTBOX/error"
      export CH_NATIVE_OUTCOMES="$OUTBOX/error/native-outcomes.json"
      printf '%s\n' '{"version":1,"integrity":"not_run","reason":"collector_not_started","preflight":{"arm_el2":"not_run","LIVE-09":"unverified"}}' > "$CH_NATIVE_OUTCOMES"
      if bash scripts/verify.sh > "$OUTBOX/error/verification.log" 2>&1; then
        printf passed
      else
        printf failed
      fi
outputs:
  api_version: c2.build-hook/v1
  status: ${{ sequence.check.outputs.stdout }}
  summary: "${{ 'Cloud Hypervisor full verification (local checks, required S26 assertions in isolated lease fixture tests, boot asset staging tests, TAP and independent supervision probes, ARM64/KVM guest execution and required reboot recovery) ' + sequence.check.outputs.stdout + '; see error/verification.log and error/native-outcomes.json.' }}"
  artifact_refs:
    error/verification.log: ${{ sequence.check.artifacts['error/verification.log'] }}
    error/native-outcomes.json: ${{ sequence.check.artifacts['error/native-outcomes.json'] }}
